<ion-header>
  <ion-toolbar color="secondary">
    <ion-title>Dashboard Principal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <!-- Uso de Grid de Ionic para Responsive Design[cite: 2] -->
  <ion-grid>
    <ion-row>
      <!-- Gráfico de barras (Ocupa toda la fila en móviles, la mitad en escritorio) -->
      <ion-col size="12" size-md="6">
        <app-stat-widget 
          title="Usuarios por Departamento" 
          type="bar" 
          [labels]="chartLabels" 
          [data]="chartValues">
        </app-stat-widget>
      </ion-col>

      <!-- Gráfico circular -->
      <ion-col size="12" size-md="6">
        <app-stat-widget 
          title="Distribución Global" 
          type="pie" 
          [labels]="chartLabels" 
          [data]="chartValues">
        </app-stat-widget>
      </ion-col>
    </ion-row>
  </ion-grid>

  <h2 class="ion-margin-top">Gestión de Usuarios</h2>
  
  <app-data-table 
    [columns]="tableColumns" 
    [dataset]="tableData"
    (actionClicked)="handleRowAction($event)">
  </app-data-table>
  
</ion-content>
