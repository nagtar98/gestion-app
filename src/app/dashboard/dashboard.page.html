<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Dashboard Principal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" color="light">
  
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6">
        <app-stat-widget 
          title="Usuarios por Departamento" 
          type="bar" 
          [labels]="chartLabels" 
          [data]="chartValues">
        </app-stat-widget>
      </ion-col>

      <ion-col size="12" size-md="6">
        <app-stat-widget 
          title="Distribución Global" 
          type="pie" 
          [labels]="chartLabels" 
          [data]="chartValues">
        </app-stat-widget>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Envolvemos la tabla en una tarjeta para que coincida con el estilo -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Gestión de Usuarios</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <app-data-table 
        [columns]="tableColumns" 
        [dataset]="tableData"
        (actionClicked)="handleRowAction($event)">
      </app-data-table>
    </ion-card-content>
  </ion-card>
  
</ion-content>
