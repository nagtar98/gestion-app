<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay" aria-label="Menú principal de navegación del sistema">
      <ion-content>
        <nav aria-label="Navegación global">
          <ion-list id="inbox-list">
            <ion-list-header role="heading" aria-level="2">Sistema de Gestión</ion-list-header>
            <ion-note>Panel Empresarial</ion-note>

            <!-- Dashboard -->
            <ion-menu-toggle auto-hide="false">
              <ion-item
                routerDirection="root"
                [routerLink]="['/dashboard']"
                lines="none"
                detail="false"
                routerLinkActive="selected"
                aria-label="Dashboard"
                tabindex="0">
                <ion-icon aria-hidden="true" slot="start" ios="stats-chart-outline" md="stats-chart-sharp"></ion-icon>
                <ion-label>Dashboard</ion-label>
              </ion-item>
            </ion-menu-toggle>

            <!-- Guía de Usuario -->
            <ion-menu-toggle auto-hide="false">
              <ion-item
                lines="none"
                detail="false"
                (click)="openUserGuide()"
                aria-label="Guía de Usuario"
                tabindex="0"
                button>
                <ion-icon aria-hidden="true" slot="start" ios="help-circle-outline" md="help-circle-sharp"></ion-icon>
                <ion-label>Guía de Usuario</ion-label>
              </ion-item>
            </ion-menu-toggle>

            <!-- Conmutador de Tema Claro / Oscuro -->
            <ion-item lines="none" class="theme-menu-item" (click)="toggleTheme()" tabindex="0" button>
              <ion-icon [name]="themeService.isDarkMode() ? 'sunny-outline' : 'moon-outline'" slot="start" aria-hidden="true"></ion-icon>
              <ion-label>{{ themeService.isDarkMode() ? 'Modo Claro' : 'Modo Oscuro' }}</ion-label>
            </ion-item>

            <!-- Cerrar Sesión (Último de la lista) -->
            <ion-menu-toggle auto-hide="false">
              <ion-item
                lines="none"
                detail="false"
                (click)="logout()"
                aria-label="Cerrar Sesión"
                tabindex="0"
                button
                class="logout-menu-item">
                <ion-icon aria-hidden="true" slot="start" ios="log-out-outline" md="log-out-sharp" color="danger"></ion-icon>
                <ion-label color="danger">Cerrar Sesión</ion-label>
              </ion-item>
            </ion-menu-toggle>
          </ion-list>
        </nav>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
