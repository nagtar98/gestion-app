<ion-card>
  <ion-card-header>
    <ion-card-title class="ion-text-center">{{ title }}</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <!-- El div relativo con altura fija es crucial para que Chart.js no se desborde -->
    <div style="position: relative; height: 250px; width: 100%;">
      <canvas #chartCanvas></canvas>
    </div>
  </ion-card-content>
</ion-card>
