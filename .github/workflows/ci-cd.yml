name: CI/CD Pipeline - Build, Test & Quality Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-validate:
    name: Build, Lint and Quality Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint static analysis
        run: npm run lint

      - name: Generate production build
        run: npm run build

      - name: Generate Compodoc Technical Documentation
        run: npm run docs:build

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build-www
          path: www/
          retention-days: 7
